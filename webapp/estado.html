<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado | Smart Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Smart Home
            </h2>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="accesos.html">Accesos NFC</a>
                <a href="alertas.html">Alertas</a>
                <a href="estado.html" class="active">Estado del Sistema</a>
            </nav>
        </aside>
        
        <main class="content">
            <header>
                <h1>System Status</h1>
            </header>

            <section class="card" id="status-card">
                <h3>Conexión</h3>
                <div class="status-grid">
                    <div>
                        <span class="label">Backend API</span>
                        <span class="value badge good" id="api-status">Cargando...</span>
                    </div>
                    <div>
                        <span class="label">Orion CB</span>
                        <span class="value" id="orion-url">--</span>
                    </div>
                    <div>
                        <span class="label">TTN App ID</span>
                        <span class="value" id="ttn-app">--</span>
                    </div>
                    <div>
                        <span class="label">TTN API Key</span>
                        <span class="value badge" id="ttn-key-status">--</span>
                    </div>
                    <div>
                        <span class="label">Última revisión</span>
                        <span class="value" id="status-time">--</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', fetchStatus);
    </script>
</body>
</html>
