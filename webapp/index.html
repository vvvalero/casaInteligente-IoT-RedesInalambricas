<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Smart Home
            </h2>
            <nav>
                <a href="index.html" class="active">Dashboard</a>
                <a href="accesos.html">Accesos NFC</a>
                <a href="alertas.html">Alertas</a>
                <a href="estado.html">Estado del Sistema</a>
            </nav>
        </aside>
        
        <main class="content">
            <header>
                <h1>Dashboard Interactivo</h1>
                <div id="status-indicator" class="status-indicator">
                    <span class="dot"></span>
                    <span id="last-update">Actualizando...</span>
                </div>
            </header>

            <div class="dashboard-split" id="dashboard-split">
                <!-- Modelo 3D (Izquierda) -->
                <div class="house-wrapper">
                    <div class="house-container" title="Arrastra para rotar la cámara · Haz clic en una estancia para ver sus datos">
                        <div id="scene3d-root" aria-label="Escena 3D interactiva"></div>
                    </div>
                    <p class="house-hint">Arrastra para rotar la cámara &middot; Clic en una estancia para explorar</p>
                </div>

                <!-- Panel de Detalles del Sensor Seleccionado (Derecha) -->
                <div class="node-details" id="node-details-panel">
                    <div class="empty-state">
                        Selecciona una estancia en el modelo 3D para ver sus datos en tiempo real.
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script type="module" src="scene3d.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchNodos();
            setInterval(fetchNodos, 30000); // 30s
        });
    </script>
</body>
</html>
