<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>🏠 Smart Home</h2>
            <nav>
                <a href="index.html" class="active">Dashboard</a>
                <a href="accesos.html">Accesos NFC</a>
                <a href="alertas.html">Alertas</a>
                <a href="estado.html">Estado del Sistema</a>
            </nav>
        </aside>
        
        <main class="content">
            <header>
                <h1>Dashboard</h1>
                <div id="status-indicator" class="status-indicator">
                    <span class="dot"></span>
                    <span id="last-update">Actualizando...</span>
                </div>
            </header>

            <div class="cards-grid" id="nodos-container">
                <!-- Cards will be dynamically inserted here -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchNodos();
            setInterval(fetchNodos, 30000); // 30s
        });
    </script>
</body>
</html>
