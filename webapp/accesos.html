<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home - Accesos NFC</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar-overlay" onclick="closeSidebar()"></div>
        <aside class="sidebar">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Smart Home
            </h2>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="accesos.html" class="active">Accesos NFC</a>
                <a href="alertas.html">Alertas</a>
                <a href="estado.html">Estado del Sistema</a>
            </nav>
            <button class="sidebar-close" onclick="closeSidebar()" aria-label="Cerrar menú">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </aside>
        
        <main class="content">
            <header>
                <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Menú">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <h1>Historial y Gestión NFC</h1>
            </header>

            <div class="split-view">
                <section class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3 style="margin: 0;">Tarjetas Autorizadas</h3>
                        <button class="btn-secondary btn-sm" onclick="syncWhitelist()" title="Sincronizar lista con el dispositivo NFC">⟲ Sincronizar</button>
                    </div>
                    <div class="uid-list" id="uid-list">Cargando...</div>

                    <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
                        <h4 style="margin: 0 0 1rem 0; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Registrar Nueva Tarjeta</h4>
                        <form id="add-uid-form" style="display: flex; flex-direction: column; gap: 1rem;">
                            <div class="form-group">
                                <label for="new-nombre" style="display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-primary);">
                                    Nombre de la Tarjeta
                                </label>
                                <input type="text" id="new-nombre"
                                    placeholder="Ej: Entrada Principal, Mi Tarjeta"
                                    style="width: 100%; padding: 0.75rem; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1rem; transition: all 0.2s; box-sizing: border-box;"
                                    onfocus="this.style.borderColor='var(--accent)'; this.style.boxShadow='0 0 0 3px rgba(99, 102, 241, 0.1)';"
                                    onblur="this.style.borderColor='var(--border-color)'; this.style.boxShadow='none';"
                                    required>
                            </div>

                            <div class="form-group">
                                <label for="new-contraseña" style="display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-primary);">
                                    Contraseña
                                </label>
                                <input type="password" id="new-contraseña"
                                    placeholder="Ej: hola, 1234, miContraseña"
                                    style="width: 100%; padding: 0.75rem; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1rem; transition: all 0.2s; box-sizing: border-box;"
                                    onfocus="this.style.borderColor='var(--accent)'; this.style.boxShadow='0 0 0 3px rgba(99, 102, 241, 0.1)';"
                                    onblur="this.style.borderColor='var(--border-color)'; this.style.boxShadow='none';"
                                    required>
                                <small style="display: block; color: var(--text-muted); margin-top: 0.5rem; font-size: 0.85rem;">
                                    La contraseña se convierte automáticamente a código hexadecimal
                                </small>
                            </div>

                            <button type="submit"
                                style="padding: 0.875rem 1.5rem; background: linear-gradient(135deg, var(--accent) 0%, #5a67d8 100%); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);"
                                onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(99, 102, 241, 0.4)';"
                                onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 8px rgba(99, 102, 241, 0.3)';"
                                class="btn-primary">
                                Registrar Tarjeta
                            </button>
                        </form>
                    </div>
                </section>

                <section class="card">
                    <h3>Historial de Accesos</h3>
                    <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Fecha/Hora</th>
                                <th>UID</th>
                                <th>Estado</th>
                                <th>Sensor</th>
                            </tr>
                        </thead>
                        <tbody id="access-log">
                            <tr><td colspan="4">Cargando...</td></tr>
                        </tbody>
                    </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchUIDs();
            fetchAccessLog();
            setInterval(fetchAccessLog, 30000);
            
            document.getElementById('add-uid-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const nombre = document.getElementById('new-nombre').value.trim();
                const contraseña = document.getElementById('new-contraseña').value.trim();
                addUID(nombre, contraseña);
            });
        });
    </script>
</body>
</html>
