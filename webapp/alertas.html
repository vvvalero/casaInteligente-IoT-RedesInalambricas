<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home - Alertas</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar-overlay" onclick="closeSidebar()"></div>
        <aside class="sidebar">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Smart Home
            </h2>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="accesos.html">Accesos NFC</a>
                <a href="alertas.html" class="active">Alertas</a>
                <a href="estado.html">Estado del Sistema</a>
            </nav>
            <button class="sidebar-close" onclick="closeSidebar()" aria-label="Cerrar menú">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </aside>

        <main class="content">
            <header>
                <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Menú">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <h1>Registro de Alertas</h1>
                <div id="status-indicator" class="status-indicator">
                    <span class="dot"></span>
                    <span id="last-update">Actualizando...</span>
                </div>
            </header>

            <section class="card" style="margin-bottom: 1.5rem;">
                <div class="card-header">
                    <h3 class="card-title">Alertas activas</h3>
                </div>
                <div id="alertas-activas">
                    <div class="empty-state">Cargando...</div>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <h3 class="card-title">Historial</h3>
                    <span style="font-size:0.8rem; color:var(--text-muted)">Últimas 50 alertas</span>
                </div>
                <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Fecha/Hora</th>
                            <th>Mensaje</th>
                            <th>Sensor</th>
                            <th>Severidad</th>
                        </tr>
                    </thead>
                    <tbody id="alertas-historial">
                        <tr><td colspan="5">Cargando...</td></tr>
                    </tbody>
                </table>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchAlertas();
            setInterval(fetchAlertas, 30000);
        });
    </script>
</body>
</html>
