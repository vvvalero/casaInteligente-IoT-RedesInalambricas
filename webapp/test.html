<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home - Test 3D</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        body { margin: 0; font-family: monospace; background: #1a1a1a; color: white; }
        #canvas { display: block; width: 100%; height: 100vh; }
        #console { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.9); padding: 20px; max-width: 500px; max-height: 400px; overflow-y: auto; }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
        .info { color: #74c0fc; }
    </style>
</head>
<body>
    <div id="console"></div>
    <script>
        const logEl = document.getElementById('console');
        const log = (msg, type = 'info') => {
            const p = document.createElement('p');
            p.textContent = msg;
            p.className = type;
            p.style.margin = '5px 0';
            logEl.appendChild(p);
            console.log(msg);
        };
        
        window.addEventListener('error', (e) => {
            log(`ERROR: ${e.message}`, 'error');
            log(`  at ${e.filename}:${e.lineno}`, 'error');
        });
        
        try {
            log('Iniciando test...');
            
            // Cargar scene3d.js
            const script = document.createElement('script');
            script.type = 'module';
            script.textContent = `
                import * as THREE from './vendor/three/three.module.js';
                try {
                    log('Three.js cargado: ' + THREE.REVISION, 'success');
                } catch (e) {
                    log('Error loading Three.js: ' + e.message, 'error');
                }
            `;
            document.head.appendChild(script);
            
            setTimeout(() => {
                log('Test completado', 'success');
            }, 2000);
            
        } catch (e) {
            log(`Exception: ${e.message}`, 'error');
        }
    </script>
</body>
</html>
