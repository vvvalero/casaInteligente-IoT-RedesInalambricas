# smarthome.conf — Virtual host Casa Inteligente IoT
# ============================================================
# Configuración para api.vvalero.dev
# por el nombre de host real de la VM en el DMZ.
# ============================================================

# -------------------------------------------------------
# Servidor HTTP — solo para ACME challenge (Let's Encrypt)
# y redirección a HTTPS
# -------------------------------------------------------
server {
    listen 80;
    server_name api.vvalero.dev;

    # Ruta para renovación automática de certificados
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → redirigir a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------
# Servidor HTTPS — proxy al stack Fiware
# -------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.vvalero.dev;

    # Certificados TLS (generados por Certbot)
    ssl_certificate     /etc/letsencrypt/live/api.vvalero.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vvalero.dev/privkey.pem;

    # Configuración TLS moderna (TLS 1.2 y 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # ---- Webhook de TTN → IoT Agent ----
    # TTN envía POST a /iot/ul con el payload del uplink
    location /iot/ul {
        proxy_pass         http://iot-agent:4041/iot/ul;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cabeceras Fiware que TTN debe enviar en el webhook
        # (configuradas en TTN Console → Integrations → Webhooks → Headers)
        # proxy_set_header fiware-service smarthome;
        # proxy_set_header fiware-servicepath /;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ---- Orion Context Broker (acceso de gestión) ----
    # OPCIONAL: descomentar solo si necesitas acceso externo a Orion
    # para pruebas. En producción mantenerlo comentado.
    #
    # location /v2/ {
    #     proxy_pass         http://orion:1026/v2/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host $host;
    #     proxy_set_header   fiware-service smarthome;
    #     proxy_set_header   fiware-servicepath /;
    # }

    # ---- Notification server (alertas y access-log) ----
    # Endpoints de consulta para la futura webapp
    location /api/ {
        proxy_pass         http://notification-server:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Health check público ----
    location /health {
        proxy_pass http://notification-server:5000/health;
    }
}
