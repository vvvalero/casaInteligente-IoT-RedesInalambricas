# ============================================================================
# Configuración Nginx para Casa Inteligente IoT (DMZ)
# ============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;

    # Permitir validación Let's Encrypt en HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# HTTPS — API + Webapp
# ============================================================================
server {
    listen 443 ssl;
    server_name _;

    # Certificados TLS
    ssl_certificate /etc/letsencrypt/live/api.vvalero.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vvalero.dev/privkey.pem;

    # Configuración SSL/TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ========================================================================
    # Rutas API → Proxy inverso
    # ========================================================================

    # TTN Webhook uplinks → Notification Server (Flask)
    location = /iot/ul {
        proxy_pass http://notification-server:5000/iot/ul;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # IoT Agent — resto de endpoints /iot/
    location /iot/ {
        proxy_pass http://iot-agent:4041;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Orion Context Broker
    location /ngsi/ {
        proxy_pass http://orion:1026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notification Server
    location /api/ {
        # Manejar solicitudes CORS preflight (OPTIONS)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }
        
        proxy_pass http://notification-server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers CORS en todas las respuestas
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    }

    # Health check
    location /health {
        proxy_pass http://notification-server:5000/health;
        proxy_http_version 1.1;
        access_log off;
    }

    # ========================================================================
    # Webapp — Archivos estáticos (HTML, JS, CSS)
    # ========================================================================
    location / {
        root /var/www/html;
        try_files $uri $uri/ /index.html;
        
        # Headers para cache
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # No cachear index.html
    location = /index.html {
        root /var/www/html;
        expires -1;
        add_header Cache-Control "must-revalidate, max-age=0";
    }

    # Archivos estáticos con cache largo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Denegar acceso a ciertos archivos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
