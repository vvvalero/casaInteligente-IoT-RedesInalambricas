# docker-compose.yml — Casa Inteligente IoT · Despliegue DMZ Universidad
#
# Diferencias respecto al docker-compose.yml local (WSL2):
#   - Añade Nginx como proxy inverso con TLS (puerto 443)
#   - Añade Certbot para certificados Let's Encrypt automáticos
#   - notification_server corre dentro de Docker (no fuera como en local)
#   - Los puertos internos NO se exponen directamente al host
#
# Uso:
#   Primera vez:  bash scripts/setup_dmz.sh
#   Arrancar:     ./services start
#   Renovar cert: ./services renew-cert

services:

  # Nginx — proxy inverso + TLS, único servicio expuesto a internet
  nginx:
    image: nginx:1.25-alpine
    container_name: smarthome-nginx
    ports:
      - "80:80"      # HTTP → redirige a HTTPS + ACME challenge
      - "443:443"    # HTTPS → proxy al IoT Agent y al servidor
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../webapp:/var/www/html:ro
      - ./certbot-www:/var/www/certbot:ro
      - ./certbot-certs:/etc/letsencrypt:ro
    networks:
      - smarthome-net
    depends_on:
      - iot-agent
      - notification-server
    restart: unless-stopped

  # Certbot — renovación automática de certificados Let's Encrypt
  certbot:
    image: certbot/certbot:latest
    container_name: smarthome-certbot
    volumes:
      - ./certbot-www:/var/www/certbot
      - ./certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  orion:
    image: fiware/orion:3.10.1
    hostname: orion
    container_name: smarthome-orion
    depends_on:
      mongo-db:
        condition: service_healthy
    networks:
      - smarthome-net
    ports:
      - "127.0.0.1:1026:1026"   # Solo localhost — para scripts de inicialización FIWARE
    command: -dbhost mongo-db -logLevel WARN -noCache
    healthcheck:
      test: curl --fail -s http://orion:1026/version || exit 1
      interval: 10s
      retries: 5
    restart: unless-stopped
    # Puerto 1026 NO expuesto al host — solo accesible internamente

  mongo-db:
    image: mongo:6.0
    hostname: mongo-db
    container_name: smarthome-mongodb
    networks:
      - smarthome-net
    volumes:
      - mongo-db-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      retries: 5
    restart: unless-stopped

  # IoT Agent UltraLight 2.0 — puerto 4041 solo accesible internamente
  iot-agent:
    image: quay.io/fiware/iotagent-ul:latest
    hostname: iot-agent
    container_name: smarthome-iot-agent
    depends_on:
      orion:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - smarthome-net
    ports:
      - "127.0.0.1:4041:4041"   # Solo localhost — para scripts de inicialización FIWARE
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_NORTH_PORT=4041
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_LOG_LEVEL=WARN
      - IOTA_TIMESTAMP=true
      - IOTA_CB_NGSI_VERSION=v2
      - IOTA_AUTOCAST=true
      - IOTA_MONGO_HOST=mongo-db
      - IOTA_MONGO_PORT=27017
      - IOTA_MONGO_DB=iotagentul
      - IOTA_MQTT_HOST=mosquitto
      - IOTA_MQTT_PORT=1883
      - IOTA_DEFAULT_RESOURCE=
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      - IOTA_DEFAULT_TRANSPORT=MQTT
      - IOTA_MULTI_CORE=true
      - IOTA_AMQP_DISABLE=true
    healthcheck:
      test: curl --fail -s http://iot-agent:4041/iot/about || exit 1
      interval: 10s
      retries: 5
    restart: unless-stopped

  # Mosquitto MQTT — solo interno entre contenedores
  mosquitto:
    image: eclipse-mosquitto:2.0
    hostname: mosquitto
    container_name: smarthome-mosquitto
    networks:
      - smarthome-net
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped
    # Puertos 1883/9001 NO expuestos — solo uso interno

  # Notification Server Flask — puerto 5000 interno, Nginx lo proxea
  notification-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.notification
    container_name: smarthome-notification
    networks:
      - smarthome-net
    env_file:
      - ../.env
    environment:
      - ORION_URL=http://orion:1026
      - BLE_DISABLED=1
    depends_on:
      orion:
        condition: service_healthy
    restart: unless-stopped


networks:
  smarthome-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.1.0/24

volumes:
  mongo-db-data: {}
